services:
  mysql:
    image: mysql:8.0
    container_name: karya-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: karya_root
      MYSQL_DATABASE: karya
      MYSQL_USER: karya
      MYSQL_PASSWORD: karya_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data:
